services:
  - type: web
    name: diesel-desk-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: FUEL_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: FUEL_AUTH_SECRET
        generateValue: true
      - key: FUEL_COOKIE_SECURE
        value: "true"
      - key: FUEL_COOKIE_SAMESITE
        value: strict
      - key: FUEL_CORS_ORIGINS
        sync: false
      - key: FUEL_PHOTO_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FUEL_OCR_PROVIDER
        value: google_vision
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
